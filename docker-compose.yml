version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: icdesign-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: icdesign-backend
    restart: unless-stopped

    env_file:
      - ./server/.env

    ports:
      - "5000:5000"

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

      args:
        - VITE_API_URL=/api

    container_name: icdesign-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  mongodb_data:
  uploads_data:
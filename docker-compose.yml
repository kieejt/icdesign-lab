services:
  mongodb:
    # 7.0 rather than 6.0: 6.0 reached end of life in July 2025 and no longer gets
    # security fixes. A data directory written by 6.0 opens directly under 7.0; see
    # "Upgrading MongoDB" in the README for the one follow-up command.
    image: mongo:7.0
    container_name: icdesign-mongodb
    restart: unless-stopped

    # Sized for a ~2 GB VPS. WiredTiger otherwise reserves half of (RAM - 1 GB)
    # for its cache (440 MB measured here) for a database of a few MB; 0.25 GB is
    # its minimum and still holds the whole data set many times over. The
    # container limit stops a runaway query from taking the API down with it.
    command: ['--wiredTigerCacheSizeGB', '0.25']
    mem_limit: 512m

    # No `ports:` on purpose.
    #
    # This used to publish 27017 to the host. Docker writes its own iptables
    # rules, so a published port is reachable from the internet even when UFW
    # says the port is closed — the database was effectively public, and the
    # container runs without authentication by default. The backend reaches it
    # over the compose network by service name, which needs no published port.
    #
    # To inspect the database from the host, tunnel instead of republishing:
    #   docker compose exec mongodb mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p

    environment:
      # Read from a `.env` file beside this compose file (gitignored).
      #
      # The official image only applies these when it initialises an *empty*
      # data directory — on an existing volume they are ignored and the server
      # still starts without auth. See "Enabling MongoDB auth" in the README for
      # the one-time migration on a deployment that already has data.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      # Each probe boots mongosh (a Node process, ~60 MB and a burst of CPU), so
      # probing every 10 s cost a noticeable slice of a 2-vCPU box around the
      # clock. Probe fast while starting (deploys still wait only seconds), then
      # once a minute.
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

  backup:
    # Nightly logical backup of the whole instance. Before this there was no copy
    # of the data anywhere except the one Docker volume it lives on.
    image: mongo:7.0
    container_name: icdesign-backup
    restart: unless-stopped
    mem_limit: 256m

    depends_on:
      mongodb:
        condition: service_healthy

    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}

    volumes:
      - backups_data:/backups

    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          file="/backups/icdesign-$$(date +%Y%m%d-%H%M%S).archive.gz"
          # Separate flags rather than a URI, so a password containing @ or : needs
          # no URL-encoding.
          if mongodump --quiet --archive="$$file" --gzip --host mongodb \
               --username "$$MONGO_ROOT_USER" --password "$$MONGO_ROOT_PASSWORD" \
               --authenticationDatabase admin; then
            echo "backup written: $$file ($$(du -h "$$file" | cut -f1))"
          else
            echo "backup FAILED" >&2
            rm -f "$$file"
          fi
          find /backups -name 'icdesign-*.archive.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$((BACKUP_INTERVAL_HOURS * 3600))"
        done

  backend:
    # Production pulls this image from GHCR, built and tested by CI; the server
    # never builds. The deploy retags the release it is rolling out as `current`,
    # so a manual `docker compose up -d` on the server keeps running exactly what
    # was deployed. Locally, `docker compose up --build` builds from `build:` and
    # writes the same tag.
    image: ghcr.io/kieejt/icdesign-lab-backend:${IMAGE_TAG:-current}
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: icdesign-backend
    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      # Enables production behaviour in the app: secure cookies, no stack traces
      # in error responses, and autoIndex off (run `npm run sync-indexes` after a
      # schema change instead of rebuilding indexes on every boot).
      - NODE_ENV=production
      # Keeps V8's heap below the container limit, so under pressure Node
      # collects garbage harder instead of being OOM-killed mid-request.
      - NODE_OPTIONS=--max-old-space-size=320
      # Smaller pool: one Node process against a local Mongo never needs 20
      # sockets, and each one costs memory on both sides.
      - MONGO_POOL_SIZE=10
      # libuv threads used by sharp, bcrypt and fs; matches the 2 vCPUs.
      - UV_THREADPOOL_SIZE=2

    mem_limit: 448m

    # Loopback only, for debugging from the host. Visitors arrive through the
    # Cloudflare Tunnel (the `cloudflared` service below), which needs no
    # published port at all.
    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - uploads_data:/app/uploads

    # `docker compose up --wait` (used by the deploy) blocks on this, so a
    # container that boots and then crashes fails the deploy instead of the site.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      # Every probe starts a second Node process; see the mongodb healthcheck.
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

    depends_on:
      mongodb:
        # Wait for Mongo to accept connections, not merely for the container to
        # exist — otherwise the API can start, fail to connect and exit.
        condition: service_healthy

  frontend:
    # See the note on the backend image.
    image: ghcr.io/kieejt/icdesign-lab-frontend:${IMAGE_TAG:-current}
    build:
      context: ./client
      dockerfile: Dockerfile

      args:
        - VITE_API_URL=/api

    container_name: icdesign-frontend
    restart: unless-stopped
    mem_limit: 128m

    # Loopback only: the deploy's health check probes it. Visitors reach nginx
    # through `cloudflared` over the compose network.
    ports:
      - "127.0.0.1:3000:80"

    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

    depends_on:
      backend:
        # nginx resolves the `backend` upstream when it starts, so the API
        # container has to exist (and be serving) first.
        condition: service_healthy

  cloudflared:
    # Cloudflare Tunnel: the only way in for visitors. cloudflared dials *out* to
    # Cloudflare and carries requests back to nginx over the compose network, so
    # the server needs no open web port, no TLS certificate and no list of
    # Cloudflare addresses to keep in sync.
    #
    # Opt-in per server, because it needs that server's token: set
    # COMPOSE_PROFILES=tunnel and TUNNEL_TOKEN in `.env` (see .env.example).
    # Without them this service is simply not started (CI, local development).
    # The tunnel's public hostnames point at http://frontend:80 and are
    # configured in the Cloudflare dashboard.
    image: cloudflare/cloudflared:2026.10.7
    container_name: icdesign-cloudflared
    profiles: [tunnel]
    restart: unless-stopped
    # Measured at ~20-30 MB.
    mem_limit: 128m

    # --no-autoupdate: the image is the update mechanism (Dependabot bumps it).
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      # `:-` and not `:?`: compose interpolates every service, including ones whose
      # profile is off, and a required variable would break every server and CI
      # run that does not use the tunnel. cloudflared itself refuses to start
      # without a token.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

    depends_on:
      frontend:
        condition: service_healthy

volumes:
  mongodb_data:
  uploads_data:
  backups_data:

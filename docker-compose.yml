version: '3.8'

services:
  # Database Service
  mongodb:
    image: mongo:6.0
    container_name: icdesign-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # Backend Express API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: icdesign-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/icdesign-lab
      - JWT_SECRET=change-this-to-a-secure-secret-key-on-vps
      - CORS_ORIGINS=http://localhost,http://127.0.0.1
      # Add other scraper/service secrets here if needed:
      # - GEMINI_API_KEY=your_key
      # - GROQ_API_KEY=your_key

  # Frontend Nginx Web Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Bake the public IP/Domain of your VPS into the client build.
        # Change 'http://localhost:5000/api' to 'http://YOUR_VPS_IP:5000/api' on deployment.
        - VITE_API_URL=http://localhost:5000/api
    container_name: icdesign-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:

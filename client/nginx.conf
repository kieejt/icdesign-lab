server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    # The previous 10 KB floor meant most of the site's JSON and CSS was served
    # uncompressed; 1 KB is the usual break-even for gzip.
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # --- Static assets ------------------------------------------------------
    # Vite fingerprints every file in /assets with a content hash, so a changed
    # file always gets a new URL. That makes these safe to cache forever, and it
    # is what makes a repeat visit cost almost no network at all.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Unhashed files in the public/ root: revalidate, but serve from cache while
    # doing so, so a stale logo never blocks the render.
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    # --- SPA entry point ----------------------------------------------------
    # index.html must never be cached: it carries the <script> tags pointing at
    # the current hashed bundles. A cached copy would keep serving the previous
    # deploy's asset URLs long after they were replaced.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Without these the backend rate-limits and analytics see the proxy's
        # address for every visitor instead of the real client IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # --- Uploaded images ----------------------------------------------------
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Upload filenames are random and never rewritten, so the browser can
        # keep them indefinitely.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

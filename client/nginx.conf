# --- Caches ------------------------------------------------------------------
# Declared at http level (this file is included there by the base image).
#
# api_cache keeps public GET responses so a burst of visitors is answered by
# nginx and Node is only asked once per window. Only responses that the backend
# explicitly marks `Cache-Control: public, max-age=N` are stored — there is
# deliberately no proxy_cache_valid fallback, so anything authenticated or
# private (which carries no such header) can never be cached by accident.
proxy_cache_path /var/cache/nginx/api
    levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

# Uploads are immutable and the backend produces resized variants on demand;
# keeping them here means each variant is generated once and then served without
# touching Node at all.
proxy_cache_path /var/cache/nginx/uploads
    levels=1:2 keys_zone=uploads_cache:10m max_size=1g inactive=30d use_temp_path=off;

upstream backend_app {
    server backend:5000;
    keepalive 16;
}

# Link-preview crawlers do not run JavaScript, so they would only ever see the
# generic index.html. They are sent to the backend for a page-specific card
# instead. Search engines are intentionally NOT listed: Googlebot and Bingbot
# render the SPA, and handing them a stub would hide the real content.
map $http_user_agent $is_preview_bot {
    default 0;
    "~*(facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|whatsapp|telegrambot|discordbot|pinterest|zalo|skypeuripreview|embedly)" 1;
}

# Behind a TLS-terminating reverse proxy (Caddy on the host) every request reaches
# this container from the proxy's private address. Without the two blocks below,
# the API would see that one address for every visitor, so rate limits and the
# analytics would treat the whole internet as a single client, and the scheme would
# always read as http.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name localhost;

    # Trust X-Forwarded-For only from private networks (the host's Docker bridge),
    # never from the internet, so a visitor cannot spoof their address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compression --------------------------------------------------------
    # Build output is pre-compressed (.br / .gz beside each file, see
    # vite.config.js), so static assets cost no CPU here and use the maximum
    # compression level. The dynamic settings below are for API responses.
    gzip_static on;
    brotli_static on;

    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        text/plain text/css text/xml text/javascript application/javascript
        application/json application/xml application/rss+xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # --- Security headers ---------------------------------------------------
    # nginx does not inherit add_header into a location that declares its own, so
    # the headers live in snippets that every location includes explicitly.
    # (Server-level add_header would silently vanish from /assets, /api, ...)
    include snippets/security-headers.conf;
    include snippets/csp.conf;

    # --- Static assets ------------------------------------------------------
    # Vite fingerprints every file in /assets with a content hash, so a changed
    # file always gets a new URL. That makes these safe to cache forever, and it
    # is what makes a repeat visit cost almost no network at all.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/security-headers.conf;
        include snippets/csp.conf;
        access_log off;
        try_files $uri =404;
    }

    # Unhashed files in the public/ root: revalidate, but serve from cache while
    # doing so, so a stale logo never blocks the render.
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        include snippets/security-headers.conf;
        include snippets/csp.conf;
        access_log off;
    }

    # --- SPA entry point ----------------------------------------------------
    # index.html must never be cached: it carries the <script> tags pointing at
    # the current hashed bundles. A cached copy would keep serving the previous
    # deploy's asset URLs long after they were replaced.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/security-headers.conf;
        include snippets/csp.conf;
        expires 0;
    }

    location / {
        # Preview crawlers get a page-specific card; everyone else gets the SPA.
        set $seo_path $uri;
        if ($is_preview_bot) {
            rewrite ^ /__seo last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /__seo {
        internal;
        proxy_pass http://backend_app/api/seo/page?path=$seo_path;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Vary "User-Agent" always;
    }

    # --- Crawler files --------------------------------------------------------
    # Generated from the database so new pages appear without a rebuild.
    location = /sitemap.xml {
        proxy_pass http://backend_app/api/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /robots.txt {
        proxy_pass http://backend_app/api/seo/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_app/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Without these the backend rate-limits and analytics see the proxy's
        # address for every visitor instead of the real client IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_read_timeout 60s;

        # Shared edge cache for public reads. Anyone carrying a session cookie or
        # Authorization header (admins editing content, students) bypasses it
        # entirely, both reading and writing, so they always see live data.
        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_bypass $cookie_token $http_authorization;
        proxy_no_cache     $cookie_token $http_authorization;

        add_header X-Edge-Cache $upstream_cache_status always;
        include snippets/security-headers.conf;
        include snippets/csp.conf;
    }

    # --- Uploaded images ----------------------------------------------------
    location /uploads/ {
        proxy_pass http://backend_app/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The key includes the query string, so each ?w= variant is cached
        # separately. The backend marks these immutable for a year.
        proxy_cache uploads_cache;
        proxy_cache_key "$host$request_uri";
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;

        # Upload filenames are random and never rewritten, so the browser can
        # keep them indefinitely.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/security-headers.conf;
        # Uploads are served as images; never let one be interpreted as a page.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

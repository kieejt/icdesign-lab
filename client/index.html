<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IC Design Lab — Integrated Circuit Design Laboratory, HUST</title>
    <meta
      name="description"
      content="Integrated Circuit Design Laboratory at Hanoi University of Science and Technology. Research and training in advanced IC technology, embedded systems and computer engineering."
    />
    <meta name="theme-color" content="#FDFDFC" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/lab-logo.png" />

    <!-- The homepage hero is the LCP element, but in a client-rendered app the
         browser only discovers it after the JS bundle has run. Preloading it from
         the HTML starts the download in parallel with the bundle. The files live in
         src/assets so the build fingerprints them (one-year immutable caching) and
         rewrites these URLs; HomePage imports the same files. (A path check would
         need an inline script, which the Content-Security-Policy forbids; the
         homepage is the dominant entry point, so the unconditional hint is the
         better trade.) -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="/src/assets/hero/hero-480.avif 480w, /src/assets/hero/hero-720.avif 720w, /src/assets/hero/hero-1024.avif 1024w"
      imagesizes="100vw"
    />

    <!-- Fonts are deliberately not preloaded. Text is drawn in the fallback face first
         (font-display: swap), so they are not needed for the first paint or the LCP,
         and on a slow connection two ~50 kB preloads delay the hero image by sharing
         its bandwidth (measured: hero finished at 1.5 s, LCP 3.3 s). -->

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IC Design Lab" />
    <meta property="og:title" content="IC Design Lab — Integrated Circuit Design Laboratory" />
    <meta
      property="og:description"
      content="Research and training in advanced IC technology, embedded systems and computer engineering at Hanoi University of Science and Technology."
    />
    <meta property="og:image" content="/lab-hero.webp" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="vi_VN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are self-hosted (see src/fonts.css): no third-party connection, and
         the browser fetches only the latin / vietnamese subsets a page uses. -->

    <style>
      /*
        Inlined so it applies before the CSS bundle arrives: paints the page ground
        immediately and keeps the first frame from flashing a different white.
      */
      html,
      body {
        margin: 0;
        background: #fdfdfc;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; font-family: system-ui, sans-serif">
        <h1>JavaScript required</h1>
        <p>This site needs JavaScript enabled to run. Please enable it and reload the page.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

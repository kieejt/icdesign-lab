add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
# HTTPS only, for six months. Browsers ignore this header on plain-HTTP responses,
# so it is harmless when the container is reached directly (CI, local). It used to
# be added by Caddy; it lives here now so it does not depend on the proxy in front.
add_header Strict-Transport-Security "max-age=15552000" always;

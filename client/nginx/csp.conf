# What the SPA actually loads: its own scripts and fonts, images from any https
# host (news thumbnails come from arbitrary sources), YouTube and Google Maps
# frames. 'unsafe-inline' is for styles only (the critical CSS in index.html and
# React style attributes); scripts stay locked to 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://maps.google.com; media-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

name: CI

# Runs on every push to main and on every pull request. Deployment is the last
# job and only fires for main, so nothing reaches the server that has not been
# linted, built, booted against MongoDB and run as a container first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a branch or PR supersedes the run in flight, which saves
# minutes. `main` is the exception: its runs queue instead, so a push can never
# cancel the run that is currently deploying. (The deploy job also has its own
# non-cancelling group below.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Matches the Dockerfiles, so CI cannot pass on a version production never runs.
  NODE_VERSION: '20'
  # Images CI builds, tests and (on main) pushes; the server only pulls them.
  # Must match the `image:` names in docker-compose.yml. GHCR needs lowercase.
  IMAGE_REPO: ghcr.io/kieejt/icdesign-lab
  # Pushing happens only for a push to main, never for a pull request.
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

jobs:
  client:
    name: Client — lint, tokens, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: client
        run: npx eslint src

      - name: Design tokens
        working-directory: client
        # Colours, corners and shadows must come from the design system. The admin
        # console once drifted into its own palette because nothing checked.
        run: node scripts/check-design-tokens.mjs

      - name: Build
        working-directory: client
        run: npm run build

      - name: Check the bundle did not balloon
        working-directory: client
        # Route-level code splitting keeps the initial payload small. A static
        # import of a heavy dependency in a shared module silently undoes that,
        # and nothing else in CI would notice. Also reports the Brotli size, which
        # is what visitors actually download.
        run: |
          JS_RAW=$(find dist/assets -name '*.js' -print0 | xargs -0 stat -c%s | awk '{s+=$1} END {print s}')
          JS_BR=$(find dist/assets -name '*.js.br' -print0 | xargs -0 stat -c%s | awk '{s+=$1} END {print s}')
          {
            echo "### Client bundle"
            echo "| | size |"
            echo "|---|---|"
            echo "| JavaScript (raw) | $((JS_RAW / 1024)) kB |"
            echo "| JavaScript (brotli) | $((JS_BR / 1024)) kB |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Total JS: $((JS_RAW / 1024)) kB raw, $((JS_BR / 1024)) kB brotli"
          if [ "$JS_RAW" -gt 1600000 ]; then
            echo "::error::JS bundle is $((JS_RAW / 1024)) kB, over the 1600 kB budget"
            exit 1
          fi

  server:
    name: Server — boot and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/ci
      JWT_SECRET: ci-only-not-a-real-secret
      CORS_ORIGINS: https://allowed.example
      PORT: '5000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Parse every source file
        working-directory: server
        # There is no test suite yet, so this is the floor: a syntax error must
        # never reach a deploy.
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check
          echo "All server files parse."

      - name: Unit and integration tests
        working-directory: server
        # Covers the news agent: URL canonicalisation and de-duplication, AI
        # reply validation, selection, retry/deadline behaviour, and a full run
        # against MongoDB with fake sources and a fake ranker (no network, no AI
        # key). Each run uses a throw-away database.
        run: npm test

      - name: Sync indexes
        working-directory: server
        # The deploy runs this against the live database. Running it here first
        # proves the script, every model and the search-token backfill load.
        run: npm run sync-indexes

      - name: Boot and smoke test
        working-directory: server
        run: |
          node index.js > server.log 2>&1 &
          echo $! > server.pid

          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/api/health > /dev/null && break
            sleep 1
            if [ "$i" = "30" ]; then
              echo "::error::Server did not become healthy"
              cat server.log
              exit 1
            fi
          done
          echo "Server is up."

          fail() { echo "::error::$1"; cat server.log; kill "$(cat server.pid)"; exit 1; }
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          # Public reads must work against an empty database, not 500.
          for path in /api/members /api/research /api/news/published /api/lab-events /api/gallery /api/documents /api/recruitment /api/home; do
            [ "$(status "http://localhost:5000$path?limit=1")" = "200" ] || fail "$path did not return 200"
          done

          # Indexed search must accept accented input.
          [ "$(status 'http://localhost:5000/api/members?search=nguy%E1%BB%85n%20duc')" = "200" ] \
            || fail "member search did not return 200"

          # Crawler endpoints.
          [ "$(status http://localhost:5000/api/seo/sitemap.xml)" = "200" ] || fail "sitemap did not return 200"
          [ "$(status http://localhost:5000/api/seo/robots.txt)" = "200" ] || fail "robots.txt did not return 200"
          [ "$(status 'http://localhost:5000/api/seo/page?path=/')" = "200" ] || fail "link-preview page did not return 200"

          # A visitor who is not signed in is a normal state, not an error.
          [ "$(curl -s http://localhost:5000/api/auth/me)" = '{"user":null}' ] \
            || fail "/auth/me did not answer user: null for an anonymous visitor"

          # Public reads are cached for visitors but never for signed-in users,
          # otherwise an admin would not see their own edit.
          curl -s -D - -o /dev/null http://localhost:5000/api/members | grep -qi '^cache-control: public' \
            || fail "public reads are not cacheable for anonymous visitors"
          curl -s -D - -o /dev/null -H 'Cookie: token=x' http://localhost:5000/api/members | grep -qi '^cache-control: private, no-cache' \
            || fail "signed-in reads must not be cached"

          # Regression guards for the security work — each of these was a real
          # hole, and none of them would show up in a build.
          [ "$(status -H 'Origin: https://evil.example' http://localhost:5000/api/health)" = "403" ] \
            || fail "CORS allowed an origin outside the allowlist"
          [ "$(status -H 'Origin: https://allowed.example' http://localhost:5000/api/health)" = "200" ] \
            || fail "CORS refused an allowed origin"
          [ "$(status http://localhost:5000/api/health)" = "200" ] \
            || fail "a request with no Origin header was refused"
          [ "$(status -X POST http://localhost:5000/api/chat -H 'Content-Type: application/json' -d '{"message":"hi"}')" = "503" ] \
            || fail "the chat endpoint is not disabled"
          [ "$(status http://localhost:5000/api/nope)" = "404" ] \
            || fail "unknown routes do not 404 as JSON"
          [ "$(status -X POST http://localhost:5000/api/lectures)" = "401" ] \
            || fail "a protected route is reachable without a token"

          echo "Smoke tests passed."
          kill "$(cat server.pid)"

  backend-image:
    name: Backend image — builds, loads native modules, publishes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Write access to GHCR only here and in frontend-image, and only used on main.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          load: true
          tags: icdesign-backend:ci
          # Layer cache shared across runs: an unchanged `npm ci` layer is reused
          # instead of reinstalling every dependency.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: sharp loads inside the container
        # sharp ships a prebuilt native binary per platform. A mismatch with the
        # Alpine base image only shows up when an upload is processed, so load it
        # here, where it fails the build instead of the first image upload.
        run: |
          docker run --rm icdesign-backend:ci node -e "import('sharp').then(m => m.default({create:{width:2,height:2,channels:3,background:'#fff'}}).webp().toBuffer()).then(() => console.log('sharp ok'))"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 is built under emulation. The server is an AWS Graviton (arm64)
      # instance; amd64 stays so the image also runs on an x86 machine.
      - name: Emulation for arm64
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Publish the tested image
        # The amd64 half re-uses every layer of the build above. Tagged by
        # commit: the deploy pulls exactly the revision that passed, and a
        # rollback can pull the previous one.
        id: publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPO }}-backend:${{ github.sha }}
          # Links the package to this repository, which is what lets the deploy
          # job's own GITHUB_TOKEN pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # A scope of its own: the amd64-only build above writes `backend`, and
          # sharing it would drop the arm64 layers from the cache on every run.
          cache-from: |
            type=gha,scope=backend
            type=gha,scope=backend-publish
          cache-to: type=gha,scope=backend-publish,mode=max

      - name: sharp loads in the arm64 image
        # The same check as above, on the platform production runs.
        if: env.PUBLISH == 'true'
        run: |
          docker run --rm --platform linux/arm64 "${{ env.IMAGE_REPO }}-backend@${{ steps.publish.outputs.digest }}" \
            node -e "import('sharp').then(m => m.default({create:{width:2,height:2,channels:3,background:'#fff'}}).webp().toBuffer()).then(() => console.log('sharp ok (arm64)'))"

  frontend-image:
    name: Frontend image — nginx config is valid, publishes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          load: true
          tags: icdesign-frontend:ci
          # The same value docker-compose.yml passes: this image is the one that
          # ships, so it must call the API on its own origin, not localhost:5000.
          build-args: VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: nginx accepts the configuration
        # The deploy health check only probes the backend, so a config nginx
        # refuses to load (a missing module, a typo) would otherwise ship and
        # take the whole site down. `backend` is mapped to loopback because the
        # upstream block resolves its hostname when the config is parsed.
        run: docker run --rm --add-host backend:127.0.0.1 icdesign-frontend:ci nginx -t

      - name: Serves pre-compressed assets and the security headers
        run: |
          docker run -d --name fe --add-host backend:127.0.0.1 -p 8080:80 icdesign-frontend:ci
          for i in $(seq 1 15); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done

          fail() { echo "::error::$1"; docker logs fe; exit 1; }

          HEADERS=$(curl -sI http://localhost:8080/)
          echo "$HEADERS" | grep -qi '^content-security-policy' || fail "CSP header missing"
          echo "$HEADERS" | grep -qi '^x-frame-options' || fail "security headers missing"
          echo "$HEADERS" | grep -qi '^strict-transport-security' || fail "HSTS header missing"
          # Browsers must revalidate the shell (max-age=0); the shared cache in front
          # may keep it for a few minutes (s-maxage), and the deploy purges it.
          echo "$HEADERS" | grep -i '^cache-control' | grep -qi 'max-age=0'             || fail "index.html must be revalidated by browsers"
          echo "$HEADERS" | grep -i '^cache-control' | grep -qi 's-maxage'             || fail "index.html is not cacheable by the edge"
          [ "$(echo "$HEADERS" | grep -ci '^cache-control')" = "1" ]             || fail "index.html carries more than one Cache-Control header"

          JS=$(curl -s http://localhost:8080/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          [ -n "$JS" ] || fail "index.html does not reference a bundle"
          curl -sI -H 'Accept-Encoding: br' "http://localhost:8080$JS" | grep -qi '^content-encoding: br' \
            || fail "Brotli is not being served for $JS"
          curl -sI -H 'Accept-Encoding: gzip' "http://localhost:8080$JS" | grep -qi '^content-encoding: gzip' \
            || fail "gzip fallback is not being served for $JS"
          curl -sI "http://localhost:8080$JS" | grep -qi 'immutable' \
            || fail "hashed assets are not cached as immutable"

          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/people/students)" = "200" ] \
            || fail "SPA fallback broken"

          # The shipped bundle must call the API on its own origin.
          if docker exec fe sh -c "grep -l 'localhost:5000' /usr/share/nginx/html/assets/*.js" > /dev/null; then
            fail "the bundle points at localhost:5000 - VITE_API_URL was not set"
          fi

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Emulation for arm64
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Publish the tested image
        # The Vite build runs once, natively (see client/Dockerfile); only the
        # small nginx stage is built per platform.
        id: publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./client
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPO }}-frontend:${{ github.sha }}
          build-args: VITE_API_URL=/api
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=gha,scope=frontend
            type=gha,scope=frontend-publish
          cache-to: type=gha,scope=frontend-publish,mode=max

      - name: nginx accepts the configuration in the arm64 image
        # The Brotli module is a separate Alpine package per architecture.
        if: env.PUBLISH == 'true'
        run: |
          docker run --rm --platform linux/arm64 --add-host backend:127.0.0.1 \
            "${{ env.IMAGE_REPO }}-frontend@${{ steps.publish.outputs.digest }}" nginx -t

  compose:
    name: Compose — configuration and backups
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Provide the env file compose expects
        # docker-compose.yml reads server/.env, which is gitignored. Without it,
        # `docker compose config` fails before it ever checks the real rules —
        # this job was red for that reason alone.
        run: cp server/.env.example server/.env

      - name: Validate with the required variables present
        env:
          MONGO_ROOT_USER: ci
          MONGO_ROOT_PASSWORD: ci
        run: docker compose config --quiet

      - name: The tunnel profile is valid
        # Production starts cloudflared through this profile; a mistake in that
        # service would otherwise only surface during a deploy.
        env:
          MONGO_ROOT_USER: ci
          MONGO_ROOT_PASSWORD: ci
          COMPOSE_PROFILES: tunnel
          TUNNEL_TOKEN: ci
        run: docker compose config --services | grep -qx cloudflared

      - name: Fail loudly when database credentials are missing
        # The compose file uses `${VAR:?}` so an unconfigured deploy stops before
        # it starts Mongo without a password. Asserting it here keeps that guard
        # from being quietly removed.
        run: |
          if docker compose config --quiet 2>/dev/null; then
            echo "::error::Compose accepted a missing MONGO_ROOT_USER"
            exit 1
          fi
          echo "Compose correctly refuses to start without database credentials."

      - name: Backup service produces an archive
        # Starts the real MongoDB 7 container with authentication plus the backup
        # service, and waits for the first archive. This also proves the data
        # directory initialises under 7.0 and that the dump credentials work.
        env:
          MONGO_ROOT_USER: ci
          MONGO_ROOT_PASSWORD: ci
        run: |
          docker compose up -d mongodb backup
          for i in $(seq 1 40); do
            docker compose logs backup 2>&1 | grep -q 'backup written' && break
            if [ "$i" = "40" ]; then
              echo "::error::the backup service did not write an archive"
              docker compose logs
              exit 1
            fi
            sleep 3
          done
          docker compose logs backup
          docker compose down -v

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reports known vulnerabilities in production dependencies without blocking a
    # merge: an advisory with no fix available must not freeze every deploy.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [client, server]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to VPS
    needs: [client, server, backend-image, frontend-image, compose]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    # Two deploys must never run at once, and one in progress must never be
    # cancelled halfway: a killed `docker compose up` can leave the site down.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    # Pull access to this repository's images on GHCR, for this job only.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # The job's own token: it can read this repository's packages and expires
          # when the job ends, so no registry credential is ever stored on the server.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ github.sha }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,RELEASE,IMAGE_REPO
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd icdesign-lab

            # --- Pre-flight -------------------------------------------------
            # Checked before anything is touched. The compose file requires the
            # database credentials, so without them `up` fails — and finding that
            # out after stopping the old containers means an outage instead of a
            # refused deploy.
            for f in .env server/.env; do
              if [ ! -f "$f" ]; then
                echo "Missing $f on the server — see 'Security notes' in the README."
                exit 1
              fi
            done

            # Remember where to go back to if the new release does not come up.
            PREVIOUS=$(git rev-parse HEAD)
            PREVIOUS_RELEASE=$(cat .image-tag 2>/dev/null || true)
            echo "Current revision: $PREVIOUS (image: ${PREVIOUS_RELEASE:-built on this server})"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io > /dev/null 2>&1 || true' EXIT

            # The exact commit CI tested, not whatever main is by now, so the
            # compose file always matches the images being pulled.
            git fetch origin main
            git reset --hard "$RELEASE"

            # Points the `current` tag (what docker-compose.yml runs) at a release,
            # pulling its images first if they are not on disk.
            use_release() {
              for svc in backend frontend; do
                img="$IMAGE_REPO-$svc"
                docker image inspect "$img:$1" > /dev/null 2>&1 || docker pull -q "$img:$1" || return 1
                docker tag "$img:$1" "$img:current" || return 1
              done
            }

            # --- Fetch the release ----------------------------------------------
            # The server never builds: CI built and tested these images. A failed
            # pull stops here, before any running container is touched.
            use_release "$RELEASE"

            # --- Start ----------------------------------------------------------
            # No `docker compose down`: `up` recreates only the services whose
            # image or configuration changed. `--wait` blocks until every service
            # with a healthcheck reports healthy (or fails), so a container that
            # starts and immediately crashes is caught here, not by a visitor.
            healthy=1
            docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180 || healthy=0

            # --- Verify through the front door ---------------------------------
            # Probe the public path (nginx -> API), not just the backend port, so a
            # broken nginx config or proxy rule also fails the deploy.
            if [ "$healthy" = "1" ]; then
              ok=0
              for i in $(seq 1 20); do
                if curl -fsS http://localhost:3000/ > /dev/null 2>&1 \
                  && curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
                  ok=1
                  break
                fi
                sleep 3
              done
              [ "$ok" = "1" ] || healthy=0
            fi

            if [ "$healthy" != "1" ]; then
              echo "New release failed its health check — rolling back to $PREVIOUS"
              docker compose logs --tail 80 backend frontend || true
              git reset --hard "$PREVIOUS"
              if [ -n "$PREVIOUS_RELEASE" ] && use_release "$PREVIOUS_RELEASE"; then
                docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180
              else
                # Only the first deploy from GHCR has no previous image to return
                # to; build the previous revision here as the old pipeline did.
                docker compose up -d --build --remove-orphans --wait --wait-timeout 180
              fi
              exit 1
            fi

            echo "$RELEASE" > .image-tag

            # Indexes are not built at boot in production; this is a no-op when
            # nothing changed.
            docker compose exec -T backend npm run sync-indexes || \
              echo "Index sync failed — run 'npm run sync-indexes' manually."

            # Releases stay on disk for a week for an instant rollback; GHCR keeps
            # every one. The build cache is left over from when this server built
            # images and is no longer used.
            docker image prune -af --filter 'until=168h'
            docker builder prune -af

            echo "Deployed $(git rev-parse --short HEAD) successfully."

      # The HTML is cached at Cloudflare's edge (nginx sends s-maxage), so a release
      # is only visible once that copy is dropped. This token can do nothing but purge
      # the cache for this one zone. Skipped when the secrets are not configured.
      - name: Purge the Cloudflare cache
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_PURGE_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "Cloudflare secrets are not set; skipping the purge."
            exit 0
          fi
          RESPONSE=$(curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache"             -H "Authorization: Bearer $CLOUDFLARE_PURGE_TOKEN" -H "Content-Type: application/json"             --data '{"purge_everything":true}')
          echo "$RESPONSE" | grep -q '"success":true' || { echo "::error::Cloudflare purge failed: $RESPONSE"; exit 1; }
          echo "Cloudflare cache purged."

version: 2

# Security patches are the point here. Updates are grouped and monthly so the
# repository does not fill with one pull request per package — a noisy bot gets
# ignored, and then the security updates get ignored with it.
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      client-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      server-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  # Base images (node, alpine, mongo) carry the OS-level security patches.
  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

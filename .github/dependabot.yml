version: 2

# Security patches are the point here. Updates are grouped and monthly so the
# repository does not fill with one pull request per package — a noisy bot gets
# ignored, and then the security updates get ignored with it.
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      client-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      server-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  # Base images (node, alpine, mongo) carry the OS-level security patches.
  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # Odd-numbered Node releases never become LTS and are supported for about
      # six months; production stays on the current even-numbered LTS.
      - dependency-name: node
        versions: ['25.x', '27.x', '29.x']

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # Odd-numbered Node releases never become LTS and are supported for about
      # six months; production stays on the current even-numbered LTS.
      - dependency-name: node
        versions: ['25.x', '27.x', '29.x']

  # Images pinned in docker-compose.yml: mongo and cloudflared.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # A MongoDB major upgrade must go one release at a time with the
      # featureCompatibilityVersion raised in between, against the real data
      # directory; CI only ever starts an empty one. Done by hand (README,
      # "Upgrading MongoDB"); minor and patch updates still come through.
      - dependency-name: mongo
        update-types: ['version-update:semver-major']
